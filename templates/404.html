<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — ATS Resume Builder</title>
  {% load static %}
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;">
  <div>
    <div style="width:80px;height:80px;border-radius:24px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </div>
    <h1 style="font-size:3rem;font-weight:800;color:var(--accent);margin-bottom:.5rem;">404</h1>
    <h2 style="font-size:1.5rem;font-weight:600;margin-bottom:1rem;">Page Not Found</h2>
    <p style="color:var(--text-2);margin-bottom:2rem;max-width:400px;">The page you're looking for doesn't exist or has been moved.</p>
    <div style="display:flex;gap:1rem;justify-content:center;">
      <a href="/" class="btn btn--primary">Go Home</a>
      <a href="javascript:history.back()" class="btn btn--secondary">Go Back</a>
    </div>
  </div>
</div>
<script src="{% static 'js/main.js' %}"></script>
</body>
</html>
